name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem install benchmark-ips --no-document
      - name: Run tests
        run: bundle exec rake
      - name: Smoke compare against the validation fixture
        run: |
          ruby validation/build_fixture.rb "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          ruby -I "$GITHUB_WORKSPACE/lib" "$GITHUB_WORKSPACE/exe/benchtrack" compare v-base big-regression --suite bench/ips.rb --blocks 5 --seed 42 --json "$RUNNER_TEMP/smoke-report.json"
